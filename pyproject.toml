[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netriq-core"
version = "1.0.0"
description = "AI-Powered Network Intrusion Detection & Automated Dual-Layer Response Framework"
readme = "README.md"
authors = [
    { name = "NetrIQ Core Team", email = "dev@netriq.io" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cybersecurity", "nids", "random-forest", "ai-security", "intrusion-detection", "firewall", "quarantine"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "motor>=3.2.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0"
]

[project.scripts]
netriq-cli = "framework.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "backend*"]
